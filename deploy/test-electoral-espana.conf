<VirtualHost *:80>
    ServerName test-electoral-espana.45.79.220.248.sslip.io
    ServerAdmin edfasano70@gmail.com
    DocumentRoot /var/www/test-electoral-espana

    <Directory /var/www/test-electoral-espana>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <FilesMatch "\.(sql|md|txt)$">
        Require all denied
    </FilesMatch>
    <FilesMatch "(^\.|~$)">
        Require all denied
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/test-electoral-espana-error.log
    CustomLog ${APACHE_LOG_DIR}/test-electoral-espana-access.log combined
</VirtualHost>
